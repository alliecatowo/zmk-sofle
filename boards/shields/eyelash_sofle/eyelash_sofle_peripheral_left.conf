# ── Peripheral Left config ────────────────────────────────────────────────────
# Left half runs on battery — aggressive power management is critical.
# This half is never the BLE central; it connects outbound to the dongle.

# ── Sleep: enabled with short timeout (battery-powered) ──────────────────────
CONFIG_ZMK_SLEEP=y
# Sleep after 5 minutes idle (300,000ms). Main conf defaults to 1hr — too long.
# Reduces deep-sleep wake cycles and extends battery life significantly.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=300000

# ── BLE connection ────────────────────────────────────────────────────────────
# Request 7.5ms connection interval (min=6 × 1.25ms) for low latency.
# Dongle and halves are co-located on a desk — low interval is fine.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12

# ── TX Power ──────────────────────────────────────────────────────────────────
# Reduce TX power on battery-powered halves.
# At desk range (<1m to dongle), -20 dBm is sufficient and saves battery.
# If you see connection drops, try CONFIG_BT_CTLR_TX_PWR_MINUS_8=y instead.
CONFIG_BT_CTLR_TX_PWR_MINUS_20=y

# ── Hardware ──────────────────────────────────────────────────────────────────
# Enable SPI
CONFIG_SPI=y

# External power control
CONFIG_ZMK_EXT_POWER=y

# Left encoder
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# ── Backlight ─────────────────────────────────────────────────────────────────
CONFIG_ZMK_BACKLIGHT=y
CONFIG_ZMK_BACKLIGHT_BRT_START=100
CONFIG_ZMK_BACKLIGHT_ON_START=y
# Turn off backlight when idle to save battery
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=y

# ── RGB underglow ─────────────────────────────────────────────────────────────
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=90
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=160
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3

# Battery-powered: auto-off when idle and when not USB-powered
# AUTO_OFF_USB=y: turns off RGB when USB power is not present (i.e., on battery)
# This effectively keeps RGB off during normal wireless use → big battery savings
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=y
