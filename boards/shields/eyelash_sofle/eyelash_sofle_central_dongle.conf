# ── Dongle (Central) config ───────────────────────────────────────────────────
# The dongle is USB-powered — no battery concerns.
# It acts as the BLE central that both keyboard halves (peripherals) connect to.

# Split role - explicit central
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# Dongle mode: expect 2 peripheral halves
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# ── Sleep: disabled (USB-powered, should never sleep) ─────────────────────────
CONFIG_ZMK_SLEEP=n

# ── BLE connection ────────────────────────────────────────────────────────────
# Increase max connections to match build cmake-args (2 peripherals + 5 host profiles)
CONFIG_BT_MAX_CONN=7
CONFIG_BT_MAX_PAIRED=7

# Request 7.5ms connection interval (min=6 × 1.25ms) for low latency typing
# Max=12 (15ms) gives a small window for the peripheral to negotiate if needed
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12

# Supervision timeout: 4 seconds (400 × 10ms)
# Shorter timeout = faster detection of dropped peripheral → faster reconnect
CONFIG_BT_SUPERVISION_TIMEOUT=400

# Passkey entry not needed for split
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n

# Do NOT wipe bonds on boot — keeps peripherals paired across power cycles
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=n

# Fetch battery levels from peripheral halves (shown on dongle display)
CONFIG_BT_BAS=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# ── TX Power ──────────────────────────────────────────────────────────────────
# Dongle is USB-powered — use max TX power for reliable range
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ── HID ───────────────────────────────────────────────────────────────────────
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=n
CONFIG_ZMK_MOUSE=y

# ── Display ───────────────────────────────────────────────────────────────────
CONFIG_ZMK_DISPLAY=y

# ── External power control ────────────────────────────────────────────────────
CONFIG_ZMK_EXT_POWER=y

# ── SPI ───────────────────────────────────────────────────────────────────────
CONFIG_SPI=y

# ── Encoder ───────────────────────────────────────────────────────────────────
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# ── Backlight ─────────────────────────────────────────────────────────────────
CONFIG_ZMK_BACKLIGHT=y
CONFIG_ZMK_BACKLIGHT_BRT_START=100
CONFIG_ZMK_BACKLIGHT_ON_START=y
# Keep backlight on when idle — dongle is USB-powered, no battery drain concern
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=n

# ── RGB underglow ─────────────────────────────────────────────────────────────
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=90
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=160
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3

# Dongle is USB-powered — no need to auto-off RGB
# Keep RGB on for visual feedback of connection status
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=n
