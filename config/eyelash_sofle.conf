# ── Battery / Power Management ─────────────────────────────────────────────
# Enter idle after 30 seconds of no keypresses (was likely default 30s or higher)
CONFIG_ZMK_IDLE_TIMEOUT=30000
# Enter deep sleep after 10 minutes idle — greatly extends battery life
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000

# ── RGB Underglow Power Management ─────────────────────────────────────────
# Auto-turn off RGB when keyboard enters idle mode
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
# Auto-turn off RGB when USB is disconnected (running on battery)
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=y
# Lower max brightness (0-100) — full brightness drains fast
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=50
# Lower default brightness
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=30
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=160
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3


# ── BLE Power Management ───────────────────────────────────────────────────
# Reduce BLE TX power when connected (saves power, usually fine for desktop use)
CONFIG_BT_CTLR_TX_PWR_0=y

# ── Display Power Management ───────────────────────────────────────────────
# nice!view is already low-power (e-ink), but turn off when sleeping
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y

# ── Misc ───────────────────────────────────────────────────────────────────
# Copyright (c) 2022 Darryl deHaan
# SPDX-License-Identifier: MIT
#
# Enable 32kHz crystal
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_30PPM=y

#CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y

#EC11 enable
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

#EXT POWER
CONFIG_ZMK_EXT_POWER=y

# MOUSE
CONFIG_ZMK_MOUSE=y

CONFIG_ZMK_HID_REPORT_TYPE_NKRO=n

CONFIG_ZMK_BACKLIGHT=y
CONFIG_ZMK_BACKLIGHT_BRT_START=100
CONFIG_ZMK_BACKLIGHT_ON_START=y
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=n

# Enable ZMK Display Support
CONFIG_ZMK_DISPLAY=y

CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=8
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=8
